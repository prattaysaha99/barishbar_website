    FOOD.forEach(function (m) {
      var li = document.createElement("li");
      var row = document.createElement("div"); row.className = "row";
      var dot = document.createElement("i"); dot.className = "dot " + m[3];
      var nm = document.createElement("span"); nm.className = "name"; nm.textContent = m[0];
      var ds = document.createElement("span"); ds.className = "dots";
      var pr = document.createElement("span"); pr.className = "price"; pr.textContent = "₹" + m[2];
      row.append(dot, nm, ds, pr);
      li.appendChild(row);
      if (m[1]) { var d = document.createElement("div"); d.className = "desc"; d.textContent = m[1]; li.appendChild(d); }
      fl.appendChild(li);
    });
  }

  /* ---------- 3D ---------- */
  function start3d() {
    var T = window.THREE, cv = document.getElementById("gl");
    var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var renderer;
    try {
      if (!T) throw new Error("no three");
      renderer = new T.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
    } catch (e) { document.body.classList.add("no3d"); cv.style.display = "none"; return; }

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T.sRGBEncoding;
    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(35, 1, 0.1, 100); camera.position.z = 14;

    scene.add(new T.AmbientLight(0xffe7c8, 0.55));
    var key = new T.DirectionalLight(0xffd9a0, 1.25); key.position.set(-4, 6, 7); scene.add(key);
    var rim = new T.PointLight(0xff7a3d, 1.6, 40); rim.position.set(5, 2, -4); scene.add(rim);
    var fill = new T.PointLight(0x8fb4ff, 0.7, 40); fill.position.set(-6, -2, 3); scene.add(fill);

    function glassMat(color, op) { return new T.MeshPhongMaterial({ color: color, transparent: true, opacity: op, shininess: 160, specular: 0xffffff, side: T.DoubleSide, depthWrite: false }); }
    function liquidMat(color, emis, op) { return new T.MeshPhongMaterial({ color: color, emissive: emis, transparent: true, opacity: op, shininess: 60, specular: 0xffd9a0, side: T.DoubleSide, depthWrite: false }); }
    function lathe(pts, mat, seg) { return new T.Mesh(new T.LatheGeometry(pts.map(function (p) { return new T.Vector2(p[0], p[1]); }), seg || 56), mat); }
    function labelTex(top, bottom, bg, fg, accent) {
      var c = document.createElement("canvas"); c.width = 1024; c.height = 640; var x = c.getContext("2d");
      function draw() {
        x.fillStyle = bg; x.fillRect(0, 0, 1024, 640);
        x.strokeStyle = accent; x.lineWidth = 8; x.strokeRect(22, 22, 980, 596);
        x.fillStyle = fg; x.textAlign = "center"; x.textBaseline = "middle";
        x.font = '900 250px "Big Shoulders Display","Arial Narrow",Impact,sans-serif'; x.fillText(top, 512, 270);
        x.fillStyle = accent; x.font = '500 52px "DM Mono",monospace'; x.fillText(bottom, 512, 470);
      }
      draw();
      var t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding; t.anisotropy = 4;
      if (document.fonts && document.fonts.load) document.fonts.load('900 100px "Big Shoulders Display"').then(function () { draw(); t.needsUpdate = true; });
      return t;
    }
    function labelMesh(r, h, y, arc, tex) {
      var m = new T.Mesh(new T.CylinderGeometry(r, r, h, 40, 1, true, -arc / 2, arc), new T.MeshPhongMaterial({ map: tex, shininess: 30, side: T.DoubleSide }));
      m.position.y = y; return m;
    }
    function band(r, y, h) {
      var m = new T.Mesh(new T.CylinderGeometry(r, r, h, 48), new T.MeshPhongMaterial({ color: 0xd9a441, shininess: 120, specular: 0xfff0b0 }));
      m.position.y = y; return m;
    }

    function whisky() {
      var g = new T.Group(), inner = new T.Group(); inner.position.y = -2.7; g.add(inner);
      var gl = lathe([[0,0],[.98,0],[1.02,.1],[1.02,2.7],[.98,3.1],[.7,3.5],[.4,3.85],[.34,4.1],[.34,4.9],[.38,5.0],[.38,5.1]], glassMat(0xf0dcc0, 0.26)); gl.renderOrder = 3;
      var lq = lathe([[0,.12],[.9,.12],[.94,.2],[.94,2.65],[.9,3.0],[.64,3.4],[.34,3.75],[.28,4.1],[0,4.1]], liquidMat(0xc8741a, 0x6b3208, 0.92)); lq.renderOrder = 2;
      inner.add(gl, lq);
      inner.add(labelMesh(1.035, 1.4, 1.55, 2.3, labelTex("BARISH", "RESERVE · 750 ML", "#EFE2C8", "#1A0F05", "#B07A1E")));
      inner.add(band(1.04, 2.35, 0.06), band(1.04, 0.75, 0.06), band(.385, 5.08, 0.08));
      var cap = new T.Mesh(new T.CylinderGeometry(.4, .4, .5, 32), new T.MeshPhongMaterial({ color: 0x1a1214, shininess: 90 })); cap.position.y = 5.35; inner.add(cap);
      return { obj: g, H: 5.7, W: 2.1 };
    }
    function beer() {
      var g = new T.Group(), inner = new T.Group(); inner.position.y = -3.3; g.add(inner);
      var gl = lathe([[0,0],[.8,0],[.84,.1],[.84,3.2],[.76,3.7],[.5,4.3],[.3,4.9],[.27,5.3],[.27,6.3],[.31,6.4],[.31,6.55]], glassMat(0x7a3f0c, 0.55)); gl.renderOrder = 3;
      var lq = lathe([[0,.12],[.76,.12],[.8,.2],[.8,3.2],[.72,3.65],[.46,4.2],[.27,4.8],[0,4.8]], liquidMat(0xe59a1f, 0x7a4308, 0.92)); lq.renderOrder = 2;
      inner.add(gl, lq);
      inner.add(labelMesh(.855, 1.2, 2.1, 2.4, labelTex("BARISH", "STRONG · ICE COLD", "#12241A", "#F4E8D6", "#E8B24A")));
      var crown = new T.Mesh(new T.CylinderGeometry(.34, .31, .16, 24), new T.MeshPhongMaterial({ color: 0xd9a441, shininess: 120 })); crown.position.y = 6.62; inner.add(crown);
      return { obj: g, H: 6.8, W: 1.8 };
    }
    var ice = [];
    function glass() {
      var g = new T.Group(), inner = new T.Group(); inner.position.y = -1.35; g.add(inner);
      var gl = lathe([[0,0],[1.2,0],[1.25,.05],[1.45,2.6],[1.47,2.65],[1.4,2.65],[1.22,.5],[0,.5]], glassMat(0xe2ecf2, 0.24), 64); gl.renderOrder = 3;
      var lq = new T.Mesh(new T.CylinderGeometry(1.38, 1.22, 1.55, 48), liquidMat(0xc8741a, 0x6b3208, 0.9)); lq.position.y = 1.27; lq.renderOrder = 2;
      inner.add(gl, lq);
      [[.4, 1.95, .2, .8], [-.45, 1.75, -.2, .75]].forEach(function (p, i) {
        var c = new T.Mesh(new T.BoxGeometry(p[3], p[3], p[3]), new T.MeshPhongMaterial({ color: 0xeaf6ff, transparent: true, opacity: .5, shininess: 200, specular: 0xffffff, depthWrite: false }));
        c.position.set(p[0], p[1], p[2]); c.rotation.set(.5 + i, .7 * i, .3); c.renderOrder = 4; c.userData.y0 = p[1]; c.userData.k = i; inner.add(c); ice.push(c);
      });
      return { obj: g, H: 2.8, W: 3.0 };
    }
    var makers = { whisky: whisky, beer: beer, glass: glass };
    var items = [];
    Array.prototype.forEach.call(document.querySelectorAll("[data-stage]"), function (el) {
      var m = makers[el.getAttribute("data-stage")]();
      scene.add(m.obj); items.push({ el: el, o: m.obj, H: m.H, W: m.W, phase: Math.random() * 6 });
    });

    /* embers */
    var N = 90, pos = new Float32Array(N * 3), spd = new Float32Array(N), halfH = Math.tan(17.5 * Math.PI / 180) * 14, halfW = halfH;
    function seed(i, anyY) { pos[i*3] = (Math.random() * 2 - 1) * halfW * 1.2; pos[i*3+1] = anyY ? (Math.random() * 2 - 1) * halfH : -halfH - .2; pos[i*3+2] = (Math.random() * 2 - 1) * 4 - 1; spd[i] = .15 + Math.random() * .4; }
    for (var i = 0; i < N; i++) seed(i, true);
    var sp = document.createElement("canvas"); sp.width = sp.height = 64; var sx = sp.getContext("2d");
    var gr = sx.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, "rgba(255,200,110,1)"); gr.addColorStop(.35, "rgba(255,160,60,.45)"); gr.addColorStop(1, "rgba(255,140,40,0)");
    sx.fillStyle = gr; sx.fillRect(0, 0, 64, 64);
    var pg = new T.BufferGeometry(); pg.setAttribute("position", new T.BufferAttribute(pos, 3));
    var pts = new T.Points(pg, new T.PointsMaterial({ size: .3, map: new T.CanvasTexture(sp), transparent: true, opacity: .75, blending: T.AdditiveBlending, depthWrite: false }));
    scene.add(pts);

    var W = 0, H = 0, upp = 1, px = 0, py = 0, tx = 0, ty = 0, last = 0;
    function size() {
      W = window.innerWidth; H = window.innerHeight;
      renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
      upp = 2 * Math.tan(17.5 * Math.PI / 180) * camera.position.z / H; halfW = halfH * camera.aspect;
    }
    function frame(ms) {
      var t = still ? 0 : ms / 1000, dt = Math.min(.05, (ms - last) / 1000 || .016); last = ms;
      px += (tx - px) * .06; py += (ty - py) * .06;
      var sy = window.scrollY || 0;
      items.forEach(function (it) {
        var r = it.el.getBoundingClientRect();
        var vis = r.width > 0 && r.bottom > -120 && r.top < H + 120;
        it.o.visible = vis; if (!vis) return;
        it.o.position.x = (r.left + r.width / 2 - W / 2) * upp;
        it.o.position.y = (H / 2 - (r.top + r.height / 2)) * upp + (still ? 0 : Math.sin(t * .9 + it.phase) * .12);
        var s = Math.min(r.height * .92 / it.H, r.width * .9 / it.W) * upp; it.o.scale.setScalar(s);
        it.o.rotation.y = t * .4 + it.phase + sy * .0016 + px * .5;
        it.o.rotation.x = py * .12;
      });
      ice.forEach(function (c) { c.position.y = c.userData.y0 + Math.sin(t * 1.2 + c.userData.k * 2) * .06; c.rotation.y = t * .3 + c.userData.k; });
      if (!still) {
        for (var i = 0; i < N; i++) { pos[i*3+1] += spd[i] * dt; pos[i*3] += Math.sin(t + i) * dt * .1; if (pos[i*3+1] > halfH + .2) seed(i, false); }
        pg.attributes.position.needsUpdate = true;
      }
      renderer.render(scene, camera);
      if (!still) requestAnimationFrame(frame);
    }
    size();
    window.addEventListener("resize", function () { size(); if (still) frame(0); });
    window.addEventListener("pointermove", function (e) { tx = (e.clientX / window.innerWidth) * 2 - 1; ty = (e.clientY / window.innerHeight) * 2 - 1; }, { passive: true });
    if (still) { window.addEventListener("scroll", function () { frame(0); }, { passive: true }); frame(0); }
    else requestAnimationFrame(frame);
  }

  /* ---------- gate wiring ---------- */
  document.getElementById("yes").addEventListener("click", enter);
  document.getElementById("no").addEventListener("click", deny);
  var s = get();
  if (s === "ok") enter();
  else if (s === "no") deny();
  else { document.body.classList.add("locked"); try { document.getElementById("yes").focus(); } catch (e) {} }
})();
</script>
